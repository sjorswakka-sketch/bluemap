name: Unity-migratie controleren

on:
  push:
    branches: ["codex/unity-migration"]
  pull_request:
    branches: ["codex/unity-migration"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Bronbehoud en migratietests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Vaste PNG-decoder installeren
        run: python -m pip install Pillow==12.2.0
      - name: Eigen migratie- en pakkettests
        run: python -m unittest discover -s tests/migration -p 'test_*.py' -v
      - name: Exacte getallen en oorspronkelijke voorraadvolgorde bewaken
        run: python tools/test_inventory_state_oracle.py
      - name: Huidige Godot-bron en Unity-project controleren
        run: python tools/check_migration.py --check --output "$RUNNER_TEMP/migration-source.json"
      - name: Overdraagbare spelgegevens, IDs en regelcontracten controleren
        run: python tools/build_migration_data.py --check --report "$RUNNER_TEMP/portable-data.json"
      - name: Originele pixels, audio en NL-EN-teksten controleren
        run: |
          python tools/build_migration_graphics.py --check
          python tools/build_migration_audio_text.py --check
      - name: Exacte spelgegevens voor de technische Unity-spelbasis controleren
        run: python tools/build_migration_foundation.py --check --report "$RUNNER_TEMP/foundation-data.json"
      - name: Oorspronkelijke spelerregels, invoer en Unity-oraclekopieën controleren
        run: python tools/build_migration_player.py --check --report "$RUNNER_TEMP/player-data.json"
      - name: Veilige opslag, oorspronkelijke saves en instellingen controleren
        run: python tools/build_migration_persistence.py --check --report "$RUNNER_TEMP/persistence-data.json"
      - name: Eerste speelroute, oorspronkelijke spelregels en tekeningen controleren
        run: |
          python tools/build_migration_route.py --check --report "$RUNNER_TEMP/route-data.json"
          python tools/record_migration_route_art.py --verify-reference
      - name: Alle oorspronkelijke gebieden, toegangspunten en wereldtekeningen controleren
        run: |
          python tools/build_migration_world_access.py --check --report "$RUNNER_TEMP/world-access-data.json"
          python tools/record_migration_world_art.py --verify-reference
      - name: Oorspronkelijke inventaris, buit en opslagregels controleren
        run: python tools/build_migration_inventory_state.py --check --report "$RUNNER_TEMP/inventory-data.json"
      - name: Oorspronkelijke ervaring, uitrusting, upgrades en uiterlijk controleren
        run: python tools/build_migration_progression.py --check --report "$RUNNER_TEMP/progression-data.json"
      - name: Oorspronkelijke gevechten, monsters, projectielen en wilde dieren controleren
        run: python tools/build_migration_combat.py --check --report "$RUNNER_TEMP/combat-data.json"
      - name: Alle oorspronkelijke gesprekken, quests, voorwaarden en gevolgen controleren
        run: python tools/build_migration_story.py --check --report "$RUNNER_TEMP/story-data.json"
      - name: Referentie, releasegegevens en teksten controleren
        run: |
          python tools/freeze_godot_reference.py --check
          python tools/check_release.py
          python tools/i18n.py check
      - name: Broncontrole bewaren
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-migratie-broncontrole-${{ github.sha }}
          path: |
            ${{ runner.temp }}/migration-source.json
            ${{ runner.temp }}/portable-data.json
            ${{ runner.temp }}/foundation-data.json
            ${{ runner.temp }}/player-data.json
            ${{ runner.temp }}/persistence-data.json
            ${{ runner.temp }}/route-data.json
            ${{ runner.temp }}/world-access-data.json
            ${{ runner.temp }}/inventory-data.json
            ${{ runner.temp }}/progression-data.json
            ${{ runner.temp }}/combat-data.json
            ${{ runner.temp }}/story-data.json
            migration/phase-08/source-contracts.json
            migration/phase-09/source-contracts.json
            migration/phase-10/source-contracts.json
            migration/phase-11/source-contracts.json
            migration/phase-12/source-contracts.json
            migration/phase-13/source-contracts.json
            migration/phase-14/source-contracts.json
            migration/phase-15/source-contracts.json
            migration/presentation/graphics.json
            migration/presentation/audio.json
            migration/presentation/localization.json
            migration/presentation-coverage.json
            unity/Assets/BlueMapContent/Resources/BlueMapAssets/Fonts/font-manifest.json
            unity/Assets/BlueMapFoundation/Resources/BlueMapFoundation/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Gecontroleerde overdraagbare spelgegevens bewaren
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-spelgegevens-phase-04-${{ github.sha }}
          path: |
            migration/portable/
            migration/contracts/
            migration/DATA_FORMAT.md
            migration/phase-04/
          if-no-files-found: error
          retention-days: 30

  coexistence:
    name: Godot blijft werken naast Unity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bestaande Godot-versie ophalen
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Godot-start en atlas testen met afzonderlijke opslag
        run: python3 tools/run_tests.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --tests smoke_test world_atlas_test

  download:
    name: Unity-Windows-pakket controleren — lokaal gebouwd
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Beschikbare proefreferentie vaststellen
        id: preview
        run: |
          if test -f migration/preview.json; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Nog geen proefdownload aan deze bron gekoppeld; alleen broncontroles uitgevoerd."
          fi
      - name: Gepubliceerde ZIP en herkomst controleren
        if: steps.preview.outputs.available == 'true'
        run: python tools/fetch_unity_preview.py --output "$RUNNER_TEMP/unity-preview"
      - name: Gecontroleerde Windows-proefdownload
        if: steps.preview.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/unity-preview/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Pakketcontrole bewaren
        if: steps.preview.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-migratie-pakketcontrole-${{ github.sha }}
          path: |
            ${{ runner.temp }}/unity-preview/receipt.json
            ${{ runner.temp }}/unity-preview/download-verification.json
          if-no-files-found: error
          retention-days: 30

  world:
    name: Geladen wereld en veranderde toestanden opnieuw exporteren
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Vaste Godot-referentie ophalen
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
      - name: Twee echte wereldexports met geverifieerde aparte testopslag
        run: python tools/record_migration_world.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/world-evidence"
      - name: Technische spelregels tweemaal herhalen met afzonderlijke testopslag
        run: python tools/record_migration_foundation_state.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/foundation-evidence"
      - name: Oorspronkelijke beweging en stamina tweemaal herhalen met afzonderlijke testopslag
        run: python tools/record_migration_player_motion.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/player-motion-evidence"
      - name: Oorspronkelijke toetsbindingen en stickdeadzone tweemaal herhalen met afzonderlijke testopslag
        run: python tools/record_migration_player_input.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/player-input-evidence"
      - name: Oorspronkelijke save-import tweemaal herhalen met uitsluitend eigen testbestanden
        run: python tools/record_migration_saves.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/save-evidence"
      - name: Oorspronkelijke instellingen tweemaal herhalen met uitsluitend eigen testbestanden
        run: python tools/record_migration_settings.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/settings-evidence"
      - name: Oorspronkelijke gesprekken, kat, beloningen en grondstoffen tweemaal herhalen
        run: python tools/record_migration_route.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/route-evidence"
      - name: Alle oorspronkelijke toegangspunten, sleutels en veilige aankomsten tweemaal herhalen
        run: python tools/record_migration_world_access.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/world-access-evidence"
      - name: Oorspronkelijke inventaris, buit, woning- en kustopslag tweemaal herhalen
        run: python tools/record_migration_inventory_state.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/inventory-evidence"
      - name: Oorspronkelijke ervaring, uitrusting en uiterlijk tweemaal herhalen
        run: python tools/record_migration_progression.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/progression-evidence"
      - name: Oorspronkelijke wapens, aanvallen, schade en herstel tweemaal herhalen
        run: python tools/record_migration_combat.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/combat-evidence"
      - name: Oorspronkelijke vijanden, wilde dieren, bazen en projectielen tweemaal herhalen
        run: python tools/record_migration_encounter.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/encounter-evidence"
      - name: Oorspronkelijke gesprekken, keuzes, questregels en gevolgen tweemaal herhalen
        run: python tools/record_migration_story.py "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --check --evidence-dir "$RUNNER_TEMP/story-evidence"
      - name: Gerichte wereldgevolgen en uiteindelijke IDs controleren
        run: |
          python tools/check_world_witnesses.py --directory migration/world --output "$RUNNER_TEMP/world-witnesses.json"
          python tools/migration_runtime_ids.py --directory migration/world --output "$RUNNER_TEMP/world-identities.json"
      - name: Wereldexportbewijs bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unity-wereldexport-phase-05-${{ github.sha }}
          path: |
            ${{ runner.temp }}/world-evidence/receipt.json
            ${{ runner.temp }}/world-evidence/scenario-fixtures.log
            ${{ runner.temp }}/world-evidence/export-1.log
            ${{ runner.temp }}/world-evidence/export-2.log
            ${{ runner.temp }}/world-evidence/world-witnesses.json
            ${{ runner.temp }}/world-evidence/world-identities.json
            ${{ runner.temp }}/world-witnesses.json
            ${{ runner.temp }}/world-identities.json
            migration/world/index.json
            migration/world-coverage.json
            migration/phase-05/
            ${{ runner.temp }}/foundation-evidence/receipt.json
            ${{ runner.temp }}/foundation-evidence/state-oracle.json
            migration/phase-07/state-oracle.json
            ${{ runner.temp }}/player-motion-evidence/receipt.json
            ${{ runner.temp }}/player-motion-evidence/motion-oracle.json
            ${{ runner.temp }}/player-input-evidence/receipt.json
            ${{ runner.temp }}/player-input-evidence/input-oracle.json
            migration/phase-08/source-contracts.json
            migration/phase-08/motion-oracle.json
            migration/phase-08/input-oracle.json
            ${{ runner.temp }}/save-evidence/receipt.json
            ${{ runner.temp }}/save-evidence/save-oracle.json
            ${{ runner.temp }}/settings-evidence/receipt.json
            ${{ runner.temp }}/settings-evidence/settings-oracle.json
            migration/phase-09/source-contracts.json
            migration/phase-09/save-oracle.json
            migration/phase-09/settings-oracle.json
            ${{ runner.temp }}/route-evidence/receipt.json
            ${{ runner.temp }}/route-evidence/route-oracle.json
            migration/phase-10/source-contracts.json
            migration/phase-10/route-oracle.json
            ${{ runner.temp }}/world-access-evidence/receipt.json
            ${{ runner.temp }}/world-access-evidence/world-access-oracle.json
            ${{ runner.temp }}/world-access-evidence/import.log
            ${{ runner.temp }}/world-access-evidence/isolation.log
            ${{ runner.temp }}/world-access-evidence/run-*.json
            ${{ runner.temp }}/world-access-evidence/run-*.log
            ${{ runner.temp }}/world-access-evidence/difference.json
            migration/phase-11/source-contracts.json
            migration/phase-11/world-access-oracle.json
            ${{ runner.temp }}/inventory-evidence/receipt.json
            ${{ runner.temp }}/inventory-evidence/inventory-state-oracle.json
            ${{ runner.temp }}/inventory-evidence/import.log
            ${{ runner.temp }}/inventory-evidence/isolation.log
            ${{ runner.temp }}/inventory-evidence/run-*.json
            ${{ runner.temp }}/inventory-evidence/run-*.log
            ${{ runner.temp }}/inventory-evidence/difference.json
            migration/phase-12/source-contracts.json
            migration/phase-12/inventory-state-oracle.json
            ${{ runner.temp }}/progression-evidence/receipt.json
            ${{ runner.temp }}/progression-evidence/progression-oracle.json
            ${{ runner.temp }}/progression-evidence/import.log
            ${{ runner.temp }}/progression-evidence/isolation.log
            ${{ runner.temp }}/progression-evidence/run-*.json
            ${{ runner.temp }}/progression-evidence/run-*.log
            ${{ runner.temp }}/progression-evidence/difference.json
            migration/phase-13/source-contracts.json
            migration/phase-13/progression-oracle.json
            ${{ runner.temp }}/combat-evidence/receipt.json
            ${{ runner.temp }}/combat-evidence/combat-oracle.json
            ${{ runner.temp }}/combat-evidence/import.log
            ${{ runner.temp }}/combat-evidence/isolation.log
            ${{ runner.temp }}/combat-evidence/run-*.json
            ${{ runner.temp }}/combat-evidence/run-*.log
            ${{ runner.temp }}/combat-evidence/difference.json
            ${{ runner.temp }}/encounter-evidence/receipt.json
            ${{ runner.temp }}/encounter-evidence/encounter-oracle.json
            ${{ runner.temp }}/encounter-evidence/import.log
            ${{ runner.temp }}/encounter-evidence/isolation.log
            ${{ runner.temp }}/encounter-evidence/run-*.json
            ${{ runner.temp }}/encounter-evidence/run-*.log
            ${{ runner.temp }}/encounter-evidence/difference.json
            migration/phase-14/source-contracts.json
            migration/phase-14/combat-oracle.json
            migration/phase-14/encounter-oracle.json
            ${{ runner.temp }}/story-evidence/receipt.json
            ${{ runner.temp }}/story-evidence/story-oracle.json
            ${{ runner.temp }}/story-evidence/import.log
            ${{ runner.temp }}/story-evidence/isolation.log
            ${{ runner.temp }}/story-evidence/run-*.json
            ${{ runner.temp }}/story-evidence/run-*.log
            ${{ runner.temp }}/story-evidence/difference.json
            migration/phase-15/source-contracts.json
            migration/phase-15/story-oracle.json
          if-no-files-found: error
          retention-days: 30
